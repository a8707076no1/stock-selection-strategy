<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>📈 台股飆股每日</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="飆股">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: linear-gradient(180deg, #0d1424 0%, #1a1f2e 100%);
    color: #e0e6f0;
    font-family: -apple-system, "SF Pro Display", "Noto Sans TC", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 20px 12px;
    text-align: center;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  h1 { font-size: 19px; margin: 0; font-weight: bold; color: #f0c040; }
  .date-picker {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-top: 8px;
  }
  select {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  /* 大盤判決橫幅（動態顯示） */
  .verdict-banner {
    padding: 10px 20px;
    font-size: 13px;
    text-align: center;
    font-weight: bold;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .verdict-banner.red    { background: rgba(220,53,69,0.15);  color: #f85149; }
  .verdict-banner.orange { background: rgba(240,165,0,0.15);  color: #f0a500; }
  .verdict-banner.green  { background: rgba(63,185,80,0.15);  color: #3fb950; }
  .verdict-banner.gray   { background: rgba(139,148,158,0.15); color: #adbac7; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 16px;
  }
  .tile {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s, background 0.15s;
    position: relative;
  }
  .tile:active { transform: scale(0.98); background: rgba(255,255,255,0.08); }
  .tile-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .tile-icon { font-size: 22px; }
  .tile-title { flex: 1; font-size: 16px; font-weight: bold; color: #fff; }
  .tile-arrow { color: #58a6ff; font-size: 20px; opacity: 0.6; }

  .tile-summary { font-size: 12px; color: #adbac7; line-height: 1.55; }
  .tile-summary .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .tile-summary .k { color: #8b949e; }
  .tile-summary .v { color: #fff; font-weight: 500; }
  .tile-summary .pos { color: #3fb950; }
  .tile-summary .neg { color: #f85149; }
  .tile-summary .warn { color: #f0a500; }
  .tile-summary .top { margin-top: 4px; color: #58a6ff; font-size: 11px; }

  /* accent 顏色 */
  .tile.holdings   { --accent: #f0c040; }
  .tile.v42        { --accent: #ffaadd; }
  .tile.breakouts  { --accent: #56d364; }
  .tile.pullbacks  { --accent: #4a9ede; }
  .tile.merger     { --accent: #ffaa00; }
  .tile.sector     { --accent: #aaddff; }

  .section-divider {
    padding: 16px 20px 4px;
    font-size: 12px;
    color: #6b7280;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .full-chart-btn {
    display: block;
    margin: 4px 16px 16px;
    padding: 14px;
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.3);
    border-radius: 12px;
    text-decoration: none;
    color: #58a6ff;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
  }

  .external-list { padding: 0 16px 16px; }
  .external-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    margin-bottom: 8px;
    text-decoration: none;
    color: inherit;
  }
  .external-item:active { background: rgba(255,255,255,0.08); }
  .external-item .icon { font-size: 20px; margin-right: 12px; }
  .external-item .info { flex: 1; }
  .external-item .title { font-size: 13px; font-weight: bold; color: #fff; }
  .external-item .sub { font-size: 10px; color: #8b949e; margin-top: 2px; }
  .external-item .arrow { color: #58a6ff; font-size: 18px; }

  footer { text-align:center; padding: 16px 20px 30px; font-size: 10px; color: #6b7280; }
</style>
</head>
<body>

<header>
  <h1>📈 台股飆股每日</h1>
  <div class="date-picker">
    <label style="font-size:12px;color:#8b949e">選擇日期</label>
    <select id="datePicker" onchange="switchDate()"></select>
  </div>
</header>

<div id="verdictBanner" class="verdict-banner gray">載入中...</div>

<div class="section-divider">📊 今日快看</div>

<div class="grid" id="tileGrid"></div>

<a href="#" class="full-chart-btn" id="fullChartBtn">📄 開啟完整長版報告</a>

<div class="section-divider">📡 即時分析</div>

<div class="external-list">
  <a class="external-item" href="https://t.me/my_finance978_bot" target="_blank">
    <div class="icon">💬</div>
    <div class="info">
      <div class="title">Telegram 飆股 Bot</div>
      <div class="sub">/chart /assets /portfolio 等指令</div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="external-item" href="https://www.tradingview.com/chart/?symbol=TSE%3A285A&interval=1" target="_blank">
    <div class="icon">🇯🇵</div>
    <div class="info">
      <div class="title">鎧俠 Kioxia 1 分 K</div>
      <div class="sub">台股記憶體早盤領先指標</div>
    </div>
    <div class="arrow">›</div>
  </a>
</div>

<footer>© 2026 · Cloudflare Pages + GitHub Actions</footer>

<script>
const THEMES = [
  { key:"holdings",  anchor:"holdings-grid",   icon:"📊", title:"我的持股" },
  { key:"v42",       anchor:"flash-grid",      icon:"🌟", title:"V42 飆股" },
  { key:"breakouts", anchor:"breakouts-grid",  icon:"⚡",  title:"即將突破" },
  { key:"pullbacks", anchor:"pullbacks-grid",  icon:"🎯", title:"拉回月線" },
  { key:"merger",    anchor:"merger-grid",     icon:"🤝", title:"併購案" },
  { key:"sector",    anchor:"sector-rotation", icon:"🏭", title:"族群輪動" },
];

let currentDate = null;
let summary = null;

async function detectDates() {
  const dates = [];
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getTime() - i * 86400000);
    if (d.getDay() === 0 || d.getDay() === 6) continue;
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    dates.push(`${y}${m}${dd}`);
    if (dates.length >= 10) break;
  }
  const exists = [];
  for (const ymd of dates) {
    try {
      const r = await fetch(`/飆股圖表_${ymd}.html`, { method: "HEAD" });
      if (r.ok) exists.push(ymd);
    } catch {}
    if (exists.length >= 7) break;
  }
  return exists;
}

function displayDate(ymd) {
  const y = ymd.slice(0,4), m = ymd.slice(4,6), d = ymd.slice(6,8);
  const dt = new Date(`${y}-${m}-${d}`);
  const dow = ["日","一","二","三","四","五","六"][dt.getDay()];
  return `${m}/${d}（週${dow}）`;
}

async function loadSummary(ymd) {
  try {
    const r = await fetch(`/summary_${ymd}.json`);
    if (r.ok) return await r.json();
  } catch {}
  return null;
}

function fmtNum(n) {
  if (n == null) return "-";
  return Math.abs(n) >= 1000 ? n.toLocaleString() : String(n);
}

function tileHTML(theme, s) {
  let summaryHTML = "";
  if (!s) {
    summaryHTML = `<div class="tile-summary" style="color:#6b7280">尚無摘要資料</div>`;
  } else if (theme.key === "holdings") {
    const h = s.holdings || {};
    const plClass = h.total_pct >= 0 ? "pos" : "neg";
    const plSign = h.total_pl >= 0 ? "+" : "";
    let worstHTML = "";
    if (h.worst) {
      worstHTML = `<div class="row"><span class="k">最弱</span><span class="warn">${h.worst.sid} ${h.worst.name} ${h.worst.pl_pct.toFixed(1)}%</span></div>`;
    }
    summaryHTML = `<div class="tile-summary">
      <div class="row"><span class="k">總損益</span><span class="v ${plClass}">${plSign}${fmtNum(h.total_pl)}（${h.total_pct}%）</span></div>
      <div class="row"><span class="k">持有</span><span class="v">${h.count} 支｜市值 ${fmtNum(h.total_mv)}</span></div>
      ${worstHTML}
    </div>`;
  } else if (theme.key === "v42") {
    const v = s.flash || {};
    const topHTML = (v.top && v.top.length) ? `<div class="top">🎯 ${v.top.slice(0,3).join(" · ")}</div>` : "";
    summaryHTML = `<div class="tile-summary">
      <div class="row"><span class="k">命中</span><span class="v">${v.count} 支</span></div>
      <div class="row"><span class="k">分佈</span><span class="v">🏆${v.aaa} 🥇${v.aa} 🥈${v.a} ⚠️${v.b}</span></div>
      ${topHTML}
    </div>`;
  } else if (theme.key === "breakouts") {
    const b = s.breakouts || {};
    const topHTML = (b.top && b.top.length) ? `<div class="top">🎯 ${b.top.slice(0,3).join(" · ")}</div>` : "";
    summaryHTML = `<div class="tile-summary">
      <div class="row"><span class="k">候選</span><span class="v">${b.count} 支壓力突破中</span></div>
      ${topHTML}
    </div>`;
  } else if (theme.key === "pullbacks") {
    const p = s.pullbacks || {};
    const topHTML = (p.top && p.top.length) ? `<div class="top">🎯 ${p.top.slice(0,3).join(" · ")}</div>` : "";
    summaryHTML = `<div class="tile-summary">
      <div class="row"><span class="k">候選</span><span class="v">${p.count} 支拉回月線</span></div>
      ${topHTML}
    </div>`;
  } else if (theme.key === "merger") {
    const m = s.merger || {};
    if (m.count) {
      const topHTML = (m.top && m.top.length) ? `<div class="top">🎯 ${m.top.slice(0,3).join(" · ")}</div>` : "";
      summaryHTML = `<div class="tile-summary">
        <div class="row"><span class="k">今日新聞</span><span class="v">${m.count} 支併購/收購案</span></div>
        ${topHTML}
      </div>`;
    } else {
      summaryHTML = `<div class="tile-summary" style="color:#6b7280">今日無 M&A 新聞</div>`;
    }
  } else if (theme.key === "sector") {
    const sec = s.sector || {};
    const tops = sec.top && sec.top.length ? sec.top.slice(0,3).join(" · ") : "點入查看排行";
    summaryHTML = `<div class="tile-summary">
      <div class="row"><span class="k">主升族群</span><span class="v" style="text-align:right">${tops}</span></div>
    </div>`;
  }

  const url = theme.anchor ? `/飆股圖表_${currentDate}.html#${theme.anchor}` : `/飆股圖表_${currentDate}.html`;
  return `<a class="tile ${theme.key}" href="${url}">
    <div class="tile-head">
      <div class="tile-icon">${theme.icon}</div>
      <div class="tile-title">${theme.title}</div>
      <div class="tile-arrow">›</div>
    </div>
    ${summaryHTML}
  </a>`;
}

function verdictClass(v) {
  if (!v) return "gray";
  if (v.includes("🔴") || v.includes("警告")) return "red";
  if (v.includes("🟠") || v.includes("轉弱")) return "orange";
  if (v.includes("🟢") || v.includes("多方"))  return "green";
  return "gray";
}

function switchDate() {
  currentDate = document.getElementById("datePicker").value;
  render();
}

async function render() {
  if (!currentDate) return;
  summary = await loadSummary(currentDate);
  // 大盤判決 banner
  const banner = document.getElementById("verdictBanner");
  if (summary && summary.market_verdict) {
    banner.textContent = "🎯 " + summary.market_verdict;
    banner.className = "verdict-banner " + verdictClass(summary.market_verdict);
  } else {
    banner.textContent = "🟢 雲端排程運作中（GitHub Actions）";
    banner.className = "verdict-banner green";
  }
  // 6 個 tile
  document.getElementById("tileGrid").innerHTML = THEMES.map(t => tileHTML(t, summary)).join("");
  // 完整版
  document.getElementById("fullChartBtn").href = `/飆股圖表_${currentDate}.html`;
}

(async () => {
  const dates = await detectDates();
  const picker = document.getElementById("datePicker");
  if (!dates.length) {
    picker.innerHTML = `<option value="">尚無資料</option>`;
    document.getElementById("tileGrid").innerHTML = `<div style="color:#8b949e;text-align:center;padding:40px 20px">尚無資料</div>`;
    return;
  }
  picker.innerHTML = dates.map((d, i) =>
    `<option value="${d}"${i === 0 ? ' selected' : ''}>${displayDate(d)}${i === 0 ? ' · 今日' : ''}</option>`
  ).join("");
  currentDate = dates[0];
  render();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>

</body>
</html>
